general {
   no_fade_in = true
   no_fade_out = true
   hide_cursor = false
   grace = 0
   disable_loading_bar = true
}

background {
   monitor =
   path = screenshot
   blur_passes = 3
   blur_size = 7
   noise = 0
   contrast = 0.9
   brightness = 0.75
   vibrancy = 0.15
}

#input-field {
   monitor =
   size = 380, 45
   outline_thickness = 2
   outer_color = rgba(255, 255, 255, 0.25)
   inner_color = rgba(0, 0, 0, 0.25)
   font_color = rgb(255, 255, 255)
   placeholder_text =
   hide_input = false
   position = 0, -220
   halign = center
   valign = center
}

input-field {
    monitor =
    size = 300, 40
    outline_thickness = 2
    inner_color = rgba(eeeeeeff)
    
    fade_timeout = 0150
    fade_on_empty = true

    outer_color = 
    check_color = 
    fail_color = 

    font_color = $blue
    fade_on_empty = true
    rounding = 

    font_family = $font
    placeholder_text = 
    fail_text = 

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -200
    halign = center
    valign = center
}


# clock 1
#label {
   monitor =
   text = cmd[update:1000] date +"$TIME12"
   color = rgba(255, 255, 255, 1.0)
   font_size = 130
   font_family = Google Sans Code
   position = 0, 180
   halign = center
   valign = center
}

# clock
label {
    monitor =
    text = cmd[update:1]  date +"%l:%M"
    font_size = 130
    font_family = Google Sans Code
    position = 0, 0
    halign = center
    valign = center
    color = $background
}

# day
label {
    monitor =
    text = cmd[update:1] date +"%a"
    font_size = 16
    font_family = Bebas Neue
    position = -150, -425
    halign = center
    valign = top
    color = rgba(c0c0c0ff)
}

#separator
label {
    monitor =
    text = 
    font_size = 14
    font_family = Bebas Neue
    position = -100, -425
    halign = center
    valign = top
    color = rgba(c0c0c0ff)
}

