include-file = /home/bun/.config/polybar/colors.ini

[bar/main]
monitor =
bottom = false
override-redirect = true
width = 1267
height = 28
offset-x = 326
offset-y = 12
fixed-center = true

background = ${colors.bg}
foreground = ${colors.fg}
border-size = 1
border-color = ${colors.border}
padding-left = 1
padding-right = 1
module-margin = 1

font-0 = monospace:size=10;2
font-1 = monospace:weight=bold:size=10;2

modules-left = i3
modules-center = windows
modules-right = date

wm-restack = i3
cursor-click = pointer


[module/i3]
type = internal/i3
pin-workspaces = false
strip-wsnumbers = true
index-sort = true
enable-click = true

label-focused = %name%
label-focused-font = 2
label-focused-foreground = ${colors.fg}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.dim}
label-unfocused-padding = 1

label-visible = %name%
label-visible-foreground = ${colors.dim}
label-visible-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.urgent}
label-urgent-padding = 1


[module/windows]
type = custom/script
exec = python3 /home/bun/.config/polybar/windows.py
tail = true


[module/date]
type = internal/date
interval = 5
time = %H:%M
label = %time%
